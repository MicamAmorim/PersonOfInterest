services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATA_DIR: /app/data
      GO2RTC_API_URL: ${GO2RTC_API_URL:-http://go2rtc:1984}
      GO2RTC_BROWSER_BASE: /go2rtc
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      TZ: ${TZ:-America/Bahia}
    volumes:
      - ./data:/app/data
    depends_on:
      - go2rtc
      - searxng

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-personofinterest-local-search}
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:8888:8080"

  go2rtc:
    image: alexxit/go2rtc:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Bahia}
    volumes:
      - ./infra/go2rtc:/config
    ports:
      - "8555:8555/tcp"
      - "8555:8555/udp"

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${POI_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - go2rtc
