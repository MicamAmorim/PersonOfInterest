<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body{width:100%;height:100%;margin:0;background:#000;overflow:hidden}
    #videoFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
    #status{position:fixed;left:10px;bottom:10px;z-index:5;padding:5px 8px;border-radius:8px;background:rgba(0,0,0,.62);color:#d9e5f5;font:11px system-ui,sans-serif;pointer-events:none}
    #remoteAudio{display:none}
  </style>
</head>
<body>
  <iframe id="videoFrame" title="Vídeo da câmera" allow="autoplay; fullscreen"></iframe>
  <audio id="remoteAudio" autoplay></audio>
  <div id="status">Conectando…</div>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const cameraId = params.get('camera_id') || '';
  const listen = params.get('listen') === '1';
  const microphone = params.get('microphone') === '1';
  const videoFrame = document.getElementById('videoFrame');
  const remoteAudio = document.getElementById('remoteAudio');
  const status = document.getElementById('status');
  let pc;
  let ws;
  let cleanedUp = false;
  const localTracks = [];

  function report(type, message) {
    status.textContent = message || type;
    try { parent.postMessage({ source: 'personofinterest-camera-webrtc', type, message }, location.origin); } catch (_) {}
  }

  function muteMediaElement(element) {
    try { element.muted = true; } catch (_) {}
    try { element.volume = 0; } catch (_) {}
    if (element.tagName === 'AUDIO') {
      try { element.pause(); } catch (_) {}
    }
  }

  function muteDeep(root) {
    if (!root?.querySelectorAll) return;
    root.querySelectorAll('audio,video').forEach(muteMediaElement);
    root.querySelectorAll('*').forEach(element => {
      try {
        if (element.shadowRoot) muteDeep(element.shadowRoot);
      } catch (_) {}
    });
  }

  function muteVideoSurface() {
    try { muteDeep(videoFrame.contentDocument); } catch (_) {}
  }

  function hardMuteIncomingAudio() {
    remoteAudio.muted = true;
    remoteAudio.volume = 0;
    try { remoteAudio.pause(); } catch (_) {}
    try { remoteAudio.srcObject = null; } catch (_) {}
    try {
      pc?.getReceivers?.().forEach(receiver => {
        if (receiver.track?.kind === 'audio') receiver.track.enabled = false;
      });
    } catch (_) {}
    muteVideoSurface();
  }

  function stopLocalTracks() {
    while (localTracks.length) {
      const track = localTracks.pop();
      try { track.enabled = false; } catch (_) {}
      try { track.stop(); } catch (_) {}
    }
    try {
      pc?.getSenders?.().forEach(sender => {
        if (sender.track?.kind === 'audio') {
          try { sender.track.enabled = false; } catch (_) {}
          try { sender.track.stop(); } catch (_) {}
          try { sender.replaceTrack(null); } catch (_) {}
        }
      });
    } catch (_) {}
  }

  function cleanup() {
    if (cleanedUp) return;
    cleanedUp = true;
    stopLocalTracks();
    hardMuteIncomingAudio();
    try { ws?.close(); } catch (_) {}
    try { pc?.close(); } catch (_) {}
    ws = null;
    pc = null;
  }

  async function getMicrophone() {
    if (!microphone) return [];
    hardMuteIncomingAudio();
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('Microfone indisponível. Abra o app por HTTPS ou localhost.');
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      video: false,
    });
    if (cleanedUp) {
      stream.getTracks().forEach(track => track.stop());
      return [];
    }
    return stream.getAudioTracks();
  }

  async function connectAudioOnly() {
    if (!listen && !microphone) return;

    pc = new RTCPeerConnection({
      iceServers: [{ urls: ['stun:stun.cloudflare.com:3478', 'stun:stun.l.google.com:19302'] }],
    });

    if (listen && !microphone) pc.addTransceiver('audio', { direction: 'recvonly' });

    const micTracks = await getMicrophone();
    if (cleanedUp) return;
    for (const track of micTracks) {
      localTracks.push(track);
      pc.addTransceiver(track, { direction: 'sendonly' });
    }

    const remoteTracks = [];
    pc.addEventListener('track', event => {
      if (event.track.kind !== 'audio' || microphone) {
        if (event.track.kind === 'audio') event.track.enabled = false;
        return;
      }
      if (!remoteTracks.includes(event.track)) remoteTracks.push(event.track);
      remoteAudio.srcObject = new MediaStream(remoteTracks);
      remoteAudio.muted = !listen;
      remoteAudio.volume = listen ? 1 : 0;
      if (listen) remoteAudio.play().catch(() => report('autoplay-blocked', 'Toque no vídeo para iniciar o áudio.'));
    });

    pc.addEventListener('connectionstatechange', () => {
      if (pc?.connectionState === 'connected') {
        report('connected', microphone ? 'Falando para a câmera · escuta suspensa' : 'Vídeo + áudio ativos');
      }
      if (pc && ['failed', 'disconnected'].includes(pc.connectionState)) report('connection-error', `Áudio WebRTC: ${pc.connectionState}`);
    });

    const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
    const talkbackQuery = microphone ? '?talkback=1' : '';
    ws = new WebSocket(`${scheme}://${location.host}/api/cameras/${encodeURIComponent(cameraId)}/webrtc/ws${talkbackQuery}`);
    ws.addEventListener('open', async () => {
      if (cleanedUp || !pc) return;
      pc.addEventListener('icecandidate', event => {
        if (event.candidate && ws?.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'webrtc/candidate', value: event.candidate.candidate }));
        }
      });
      const offer = await pc.createOffer();
      if (cleanedUp) return;
      await pc.setLocalDescription(offer);
      if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'webrtc/offer', value: pc.localDescription.sdp }));
    });
    ws.addEventListener('message', event => {
      if (cleanedUp || !pc) return;
      const msg = JSON.parse(event.data);
      if (msg.type === 'webrtc/candidate') {
        pc.addIceCandidate({ candidate: msg.value, sdpMid: '0' }).catch(() => {});
      } else if (msg.type === 'webrtc/answer') {
        pc.setRemoteDescription({ type: 'answer', sdp: msg.value }).catch(error => report('webrtc-error', error.message));
      } else if (msg.type === 'error') {
        report('webrtc-error', msg.value || 'Falha no áudio WebRTC');
      }
    });
    ws.addEventListener('error', () => {
      if (!cleanedUp) report('signal-error', microphone ? 'Falha no talkback da câmera.' : 'Falha na sinalização de áudio.');
    });
  }

  async function connect() {
    if (!cameraId) throw new Error('Câmera não informada.');
    const response = await fetch(`/api/cameras/${encodeURIComponent(cameraId)}`, { cache: 'no-store' });
    if (!response.ok) throw new Error('Não foi possível carregar a câmera.');
    const camera = await response.json();
    if (cleanedUp) return;

    // Browser video always uses the dedicated H.264/Opus producer. Vision,
    // recorder and backend audio continue using camera.stream_name unchanged.
    const browserStream = `${camera.stream_name}_browser`;
    videoFrame.src = `/go2rtc/stream.html?src=${encodeURIComponent(browserStream)}&v=v7.2.1`;
    report('video-loading', 'Carregando vídeo H.264…');

    videoFrame.addEventListener('load', () => {
      [0, 80, 300, 1000].forEach(delay => setTimeout(muteVideoSurface, delay));
      if (listen && !microphone) remoteAudio.play().catch(() => {});
    });

    if (listen || microphone) await connectAudioOnly();
    else report('connected', 'Vídeo ativo');
  }

  addEventListener('message', event => {
    if (event.origin !== location.origin || event.data?.source !== 'personofinterest-parent') return;
    if (event.data?.type === 'hard-mute-audio') hardMuteIncomingAudio();
    if (event.data?.type === 'stop-talkback') cleanup();
  });

  addEventListener('pagehide', cleanup);
  addEventListener('beforeunload', cleanup);
  connect().catch(error => {
    cleanup();
    report('webrtc-error', error?.message || String(error));
  });
})();
</script>
</body>
</html>
