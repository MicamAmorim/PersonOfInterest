name: CI
on:
  push:
    branches: [main, v2-work, v3-v4-work, v3-v4-release]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall backend/app
      - run: python -m unittest discover -s tests -v
      - run: node --check frontend/app-core.js
      - run: node --check frontend/app-runtime.js
      - run: node --check frontend/v34.js
      - run: node --check frontend/v4-stream-fix.js
      - run: node --check frontend/v4-audio-fix.js
      - run: node --check frontend/v42-assistant.js
