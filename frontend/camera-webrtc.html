<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body,video{width:100%;height:100%;margin:0;background:#000;overflow:hidden}
    video{display:block;object-fit:contain}
    #status{position:fixed;left:10px;bottom:10px;padding:5px 8px;border-radius:8px;background:rgba(0,0,0,.62);color:#d9e5f5;font:11px system-ui,sans-serif;pointer-events:none}
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <div id="status">Conectando…</div>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const cameraId = params.get('camera_id') || '';
  const listen = params.get('listen') === '1';
  const microphone = params.get('microphone') === '1';
  const video = document.getElementById('video');
  const status = document.getElementById('status');
  let pc;
  let ws;
  const localTracks = [];

  function report(type, message) {
    status.textContent = message || type;
    try { parent.postMessage({ source: 'personofinterest-camera-webrtc', type, message }, location.origin); } catch (_) {}
  }

  async function getMicrophoneTracks() {
    if (!microphone) return [];
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('Microfone indisponível. Abra o app por HTTPS ou localhost.');
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      video: false,
    });
    return stream.getAudioTracks();
  }

  async function createPeerConnection() {
    const connection = new RTCPeerConnection({
      iceServers: [{ urls: ['stun:stun.cloudflare.com:3478', 'stun:stun.l.google.com:19302'] }],
    });

    // Follow go2rtc's official webrtc.html pattern: receiver tracks are attached
    // to the media element immediately, before SDP exchange. This avoids relying
    // on browser-specific timing of the `track` event.
    const mediaTracks = [];
    const videoReceiver = connection.addTransceiver('video', { direction: 'recvonly' }).receiver.track;
    mediaTracks.push(videoReceiver);

    if (listen) {
      const audioReceiver = connection.addTransceiver('audio', { direction: 'recvonly' }).receiver.track;
      mediaTracks.push(audioReceiver);
    }

    const micTracks = await getMicrophoneTracks();
    for (const track of micTracks) {
      localTracks.push(track);
      connection.addTransceiver(track, { direction: 'sendonly' });
    }

    video.srcObject = new MediaStream(mediaTracks);
    video.muted = !listen;
    video.addEventListener('click', () => {
      video.muted = !listen;
      video.play().catch(() => {});
    });

    connection.addEventListener('connectionstatechange', () => {
      const current = connection.connectionState;
      if (current === 'connected') {
        report('connected', microphone ? (listen ? 'Áudio + microfone ativos' : 'Microfone ativo') : (listen ? 'Áudio ativo' : 'Vídeo ativo'));
        video.play().catch(() => report('autoplay-blocked', 'Toque no vídeo para iniciar a reprodução.'));
      } else if (['failed', 'disconnected'].includes(current)) {
        report('connection-error', `WebRTC: ${current}`);
      }
    });

    return connection;
  }

  async function connect() {
    if (!cameraId) throw new Error('Câmera não informada.');
    pc = await createPeerConnection();

    const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${scheme}://${location.host}/api/cameras/${encodeURIComponent(cameraId)}/webrtc/ws`);

    ws.addEventListener('open', () => {
      pc.addEventListener('icecandidate', event => {
        if (!event.candidate || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({ type: 'webrtc/candidate', value: event.candidate.candidate }));
      });

      pc.createOffer()
        .then(offer => pc.setLocalDescription(offer))
        .then(() => ws.send(JSON.stringify({ type: 'webrtc/offer', value: pc.localDescription.sdp })))
        .catch(error => report('webrtc-error', error.message));
    });

    ws.addEventListener('message', event => {
      let msg;
      try { msg = JSON.parse(event.data); }
      catch (_) { return; }
      if (msg.type === 'webrtc/candidate') {
        pc.addIceCandidate({ candidate: msg.value, sdpMid: '0' }).catch(() => {});
      } else if (msg.type === 'webrtc/answer') {
        pc.setRemoteDescription({ type: 'answer', sdp: msg.value }).catch(error => report('webrtc-error', error.message));
      } else if (msg.type === 'error') {
        report('webrtc-error', msg.value || 'Falha WebRTC');
      }
    });

    ws.addEventListener('error', () => report('signal-error', 'Falha na sinalização WebRTC pelo PersonOfInterest.'));
    ws.addEventListener('close', () => {
      if (pc && !['closed', 'failed'].includes(pc.connectionState)) report('signal-closed', 'Sinalização WebRTC encerrada.');
    });
  }

  function cleanup() {
    localTracks.forEach(track => track.stop());
    try { ws?.close(); } catch (_) {}
    try { pc?.close(); } catch (_) {}
  }

  addEventListener('beforeunload', cleanup);
  connect().catch(error => report('webrtc-error', error?.message || String(error)));
})();
</script>
</body>
</html>
